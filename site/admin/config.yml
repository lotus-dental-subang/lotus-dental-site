# Lotus Dental: edit screen settings (Decap CMS)
# The two CHANGE-ME lines are filled in when the site goes online (GitHub repo + login helper).

backend:
  name: github
  repo: lotus-dental-subang/lotus-dental-site
  branch: main
  base_url: https://CHANGE-ME.workers.dev
  auth_endpoint: auth

# Lets us try the edit screen on this computer (npm run cms). Ignored online.
local_backend: true

# Drafts first: the clinic writes, the article waits for review, then it is published.
publish_mode: editorial_workflow

site_url: https://lotusdentalsubang.com
display_url: https://lotusdentalsubang.com
logo_url: /img/logo.png

media_folder: site/img/blog
public_folder: /img/blog

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: guides
    label: Dental guides
    label_singular: Dental guide
    description: Articles shown on the Dental guides page. New articles are saved as drafts and go live only after they are approved.
    folder: content/guides
    create: true
    delete: false
    slug: "{{slug}}"
    preview_path: "{{slug}}/"
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Short and clear, e.g. 'How long do braces take?'. It also becomes the page address."
      - label: Google summary
        name: description
        widget: text
        hint: "1-2 sentences (about 150 characters). Google shows this under the title."
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "D MMMM YYYY"
        time_format: false
        picker_utc: true
        default: "{{now}}"
        hint: "Filled with today's date. Change it only if you need to."
      - label: Main photo
        name: image
        widget: image
        required: false
        hint: "A wide (landscape) photo. Use the clinic's own photos where possible."
      - label: Treatment (for the WhatsApp button)
        name: topic
        widget: string
        required: false
        hint: "e.g. braces, teeth whitening. The box at the end will say 'Questions about braces?'"
      - label: Note at the top
        name: note
        widget: string
        required: false
        hint: "e.g. 'Prices may change. WhatsApp us for today's price.'"
      - label: Article
        name: body
        widget: markdown
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "bulleted-list", "numbered-list", "quote"]
        editor_components: ["image"]
        hint: "To add a WhatsApp link: make a link and type the word whatsapp as the address."
